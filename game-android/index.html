<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Tangkap Kotak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            Skor: <span id="score">0</span> | Rekor: <span id="highscore">0</span>
        </div>
        
        <!-- TAMPILAN MENU UTAMA / START & QUIT -->
        <div id="menu-screen" class="overlay">
            <div class="menu-box">
                <h1>Tangkap Kotak</h1>
                <p>Tangkap lingkaran hijau sebanyak mungkin!</p>
                <button id="start-btn" class="btn-primary">Mulai Game</button>
                <button id="quit-btn" class="btn-secondary">Keluar</button>
            </div>
        </div>

        <!-- TAMPILAN GAME OVER -->
        <div id="gameover-screen" class="overlay hidden">
            <div class="menu-box">
                <h2>Game Over</h2>
                <p>Skor Akhir: <span id="final-score">0</span></p>
                <button id="restart-btn" class="btn-primary">Main Lagi</button>
                <button id="menu-btn" class="btn-secondary">Menu Utama</button>
            </div>
        </div>

        <div id="player"></div>
        <div id="target"></div>
    </div>

    <div id="controls">
        <button id="left-btn">Kiri</button>
        <button id="right-btn">Kanan</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
