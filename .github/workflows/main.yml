name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Berjalan di branch main atau master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Temukan dan Jalankan Build APK
      run: |
        # Mencari letak file gradlew secara otomatis di semua folder
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: File gradlew tidak ditemukan di repositori ini!"
          exit 1
        fi
        
        # Masuk ke folder tempat gradlew berada
        DIR_PATH=$(dirname "$GRADLEW_PATH")
        cd "$DIR_PATH"
        
        echo "Mengubah izin akses gradlew di: $DIR_PATH"
        chmod +x ./gradlew
        
        echo "Memulai proses build APK..."
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aplikasi-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
